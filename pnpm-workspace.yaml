packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  msgpackr-extract: false
  unrs-resolver: false
  sharp: false
  '@scarf/scarf': false
minimumReleaseAgeExclude:
  - nodemailer@10.0.15
# Security patches for transitive dependencies (pnpm audit). Each stays within the major its parent expects.
overrides:
  mysql2: '>=3.23.1'                # Prisma CLI
  deepmerge-ts: '>=8.0.0'           # Prisma CLI
  body-parser: '^2.4.0'             # express (NestJS)
  multer: '^2.5.0'                  # @nestjs/platform-express
  qs: '^6.16.1'                     # express, body-parser
  fast-uri@3: '^3.1.9'              # ajv (Prisma CLI)
  vite: '^8.3.3'                    # vitest (dev only)
  minimatch@<11.0.1: '^11.0.1'      # eslint, glob (dev only)
